<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expo Esotérica · Live</title><link rel="stylesheet" href="../shared.css"><style>
.head{display:flex;justify-content:space-between;align-items:end;gap:25px;margin:50px 0 27px}.head h1{font:650 clamp(48px,8vw,88px)/.83 Syne;margin:8px 0;letter-spacing:-.07em}.head h1 span{color:#aaa4ff}.head p{max-width:320px;font-size:11px;line-height:1.7}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:16px}.filters button{white-space:nowrap;border:1px solid #aaa1ff18;background:#0c0e21;color:#7f839e;border-radius:99px;padding:10px 14px;font-size:9px;font-weight:800}.filters .active{background:#776dff24;color:#fff}.gallery{columns:3;column-gap:11px}.shot{break-inside:avoid;margin-bottom:11px;position:relative;overflow:hidden;border-radius:20px;border:1px solid #aaa1ff15;background:#111329;animation:enter .5s ease}.shot img{display:block;width:100%;height:auto}.meta{position:absolute;left:0;right:0;bottom:0;padding:50px 15px 14px;background:linear-gradient(transparent,#050615e8)}.meta b{display:block;font-size:11px}.meta small{font-size:8px;color:#aaaec5;letter-spacing:.08em}.empty{text-align:center;padding:80px 20px;color:#777c98}.star{color:#aaa4ff;font-size:25px}.featured:after{content:'✦ DESTACADA';position:absolute;top:12px;right:12px;padding:7px 9px;border-radius:99px;background:#090a18d9;font-size:7px;font-weight:800;letter-spacing:.1em}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:800px){.gallery{columns:2}.head{align-items:start;flex-direction:column}.head p{display:none}}@media(max-width:480px){.shell{padding:20px 11px}.gallery{column-gap:7px}.shot{margin-bottom:7px;border-radius:14px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">EXPO ESOTÉRICA</div><div class="eyebrow"><span class="dot"></span>EN VIVO</div></header><section class="head"><div><div class="eyebrow">02—04 OCT · 2026 · CINTERMEX</div><h1>Expo <span>Live.</span></h1></div><p class="muted">Los momentos de Expo Esotérica publicados en tiempo real.</p></section><nav id="filters" class="filters"></nav><section id="gallery" class="gallery"><div class="empty">Conectando con Expo Live…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const sb=supabase.createClient(EXPO_CONFIG.SUPABASE_URL,EXPO_CONFIG.SUPABASE_ANON_KEY),F=document.querySelector('#filters'),G=document.querySelector('#gallery');let rows=[],active='Todo';
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){let cats=['Todo',...new Set(rows.map(x=>x.category).filter(Boolean))];F.innerHTML=cats.map(c=>`<button data-c="${esc(c)}" class="${c===active?'active':''}">${esc(c)}</button>`).join('');const list=rows.filter(x=>active==='Todo'||x.category===active);G.innerHTML=list.length?list.map(x=>`<article class="shot ${x.featured?'featured':''}"><img src="${esc(x.public_url)}" loading="lazy" alt="${esc(x.category||'Expo Esotérica')}"><div class="meta"><b>${esc(x.category||'General')}</b><small>${esc(x.author||'Expo Esotérica')} · ${new Date(x.created_at).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div></article>`).join(''):'<div class="empty"><div class="star">✦</div>Aún no hay fotografías publicadas.</div>';F.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;draw()})}
async function load(){const {data,error}=await sb.from('event_photos').select('*').eq('status','PUBLICADA').order('created_at',{ascending:false});if(error){G.innerHTML='<div class="empty">No se pudo cargar Expo Live.</div>';return}rows=data||[];draw()}
load();sb.channel('expo-live-feed').on('postgres_changes',{event:'*',schema:'public',table:'event_photos'},()=>load()).subscribe();
</script></body></html>
