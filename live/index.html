<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expo Esotérica · Live</title><link rel="stylesheet" href="../shared.css">
<style>
.head{display:flex;justify-content:space-between;align-items:end;gap:25px;margin:50px 0 27px}.head h1{font:650 clamp(48px,8vw,88px)/.83 Syne;margin:8px 0;letter-spacing:-.07em}.head h1 span{color:#aaa4ff}.head p{max-width:320px;font-size:11px;line-height:1.7}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:16px}.filters button{white-space:nowrap;border:1px solid #aaa1ff18;background:#0c0e21;color:#7f839e;border-radius:99px;padding:10px 14px;font-size:9px;font-weight:800;cursor:pointer}.filters .active{background:#776dff24;color:#fff}.gallery{columns:3;column-gap:11px}.shot{break-inside:avoid;margin-bottom:11px;position:relative;overflow:hidden;border-radius:20px;border:1px solid #aaa1ff15;background:#111329;cursor:zoom-in}.shot img{display:block;width:100%;height:auto;transition:transform .35s}.shot:hover img{transform:scale(1.025)}.meta{position:absolute;left:0;right:0;bottom:0;padding:50px 15px 14px;background:linear-gradient(transparent,#050615e8);pointer-events:none}.meta b{display:block;font-size:11px}.meta small{font-size:8px;color:#aaaec5;letter-spacing:.08em}.empty{text-align:center;padding:80px 20px;color:#777c98}.featured:after{content:'✦ DESTACADA';position:absolute;top:12px;right:12px;padding:7px 9px;border-radius:99px;background:#090a18d9;font-size:7px;font-weight:800;pointer-events:none}
.lightbox{position:fixed;inset:0;z-index:9999;background:#03040bf2;backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:28px}.lightbox.open{display:flex}.lb-stage{position:relative;width:min(1200px,94vw);height:min(88vh,900px);display:flex;align-items:center;justify-content:center}.lb-img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:15px}.lb-close,.lb-prev,.lb-next{position:absolute;border:1px solid #ffffff24;background:#0b0d1cdd;color:#fff;cursor:pointer;display:grid;place-items:center;z-index:2}.lb-close{right:0;top:0;width:44px;height:44px;border-radius:50%;font-size:19px}.lb-prev,.lb-next{top:50%;transform:translateY(-50%);width:48px;height:58px;border-radius:16px;font-size:22px}.lb-prev{left:0}.lb-next{right:0}.lb-caption{position:absolute;bottom:0;left:50%;transform:translateX(-50%);text-align:center;padding:11px 18px;border-radius:99px;background:#080a18d9;border:1px solid #ffffff15;white-space:nowrap}.lb-caption b{font-size:11px}.lb-caption span{font-size:9px;color:#9a9eb7;margin-left:8px}
@media(max-width:800px){.gallery{columns:2}.head{align-items:start;flex-direction:column}.head p{display:none}.lightbox{padding:10px}.lb-stage{width:100%;height:90vh}.lb-img{max-height:78vh}.lb-caption{bottom:5px;max-width:90%;white-space:normal}}@media(max-width:480px){.shell{padding:20px 11px}.gallery{column-gap:7px}.shot{margin-bottom:7px;border-radius:14px}}
</style></head><body>
<main class="shell"><header class="top"><div class="brand">EXPO ESOTÉRICA</div><div class="eyebrow"><span class="dot"></span>EN VIVO</div></header><section class="head"><div><div class="eyebrow">02—04 OCT · 2026 · CINTERMEX</div><h1>Expo <span>Live.</span></h1></div><p class="muted">Los momentos de Expo Esotérica publicados en tiempo real.</p></section><nav id="filters" class="filters"></nav><section id="gallery" class="gallery"><div class="empty">Conectando con Expo Live…</div></section></main>
<div class="lightbox" id="lightbox"><div class="lb-stage"><button class="lb-close" id="lbClose">×</button><button class="lb-prev" id="lbPrev">‹</button><img class="lb-img" id="lbImg" alt=""><button class="lb-next" id="lbNext">›</button><div class="lb-caption"><b id="lbCat"></b><span id="lbAuthor"></span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script>
<script>
const sb=supabase.createClient(EXPO_CONFIG.SUPABASE_URL,EXPO_CONFIG.SUPABASE_ANON_KEY),F=document.querySelector('#filters'),G=document.querySelector('#gallery');let rows=[],active='Todo',visible=[],current=0,touchX=0;const LB=document.querySelector('#lightbox'),LI=document.querySelector('#lbImg'),LC=document.querySelector('#lbCat'),LA=document.querySelector('#lbAuthor');
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(i){if(!visible.length)return;current=(i+visible.length)%visible.length;const x=visible[current];LI.src=x.public_url;LI.alt=x.category||'Expo Esotérica';LC.textContent=x.category||'General';LA.textContent=(x.author||'Expo Esotérica')+' · '+new Date(x.created_at).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});LB.classList.add('open');document.body.style.overflow='hidden';document.querySelector('#lbPrev').style.display=visible.length>1?'grid':'none';document.querySelector('#lbNext').style.display=visible.length>1?'grid':'none'}
function closeLB(){LB.classList.remove('open');document.body.style.overflow='';LI.src=''}
function draw(){let cats=['Todo',...new Set(rows.map(x=>x.category).filter(Boolean))];F.innerHTML=cats.map(c=>`<button data-c="${esc(c)}" class="${c===active?'active':''}">${esc(c)}</button>`).join('');visible=rows.filter(x=>active==='Todo'||x.category===active);G.innerHTML=visible.length?visible.map((x,i)=>`<article class="shot ${x.featured?'featured':''}" data-i="${i}" tabindex="0"><img src="${esc(x.public_url)}" loading="lazy" alt="${esc(x.category||'Expo Esotérica')}"><div class="meta"><b>${esc(x.category||'General')}</b><small>${esc(x.author||'Expo Esotérica')} · ${new Date(x.created_at).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div></article>`).join(''):'<div class="empty">Aún no hay fotografías publicadas.</div>';F.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;draw()});G.querySelectorAll('.shot').forEach(el=>{el.onclick=()=>show(+el.dataset.i);el.onkeydown=e=>{if(e.key==='Enter'){show(+el.dataset.i)}}})}
document.querySelector('#lbClose').onclick=closeLB;document.querySelector('#lbPrev').onclick=()=>show(current-1);document.querySelector('#lbNext').onclick=()=>show(current+1);LB.onclick=e=>{if(e.target===LB)closeLB()};document.addEventListener('keydown',e=>{if(!LB.classList.contains('open'))return;if(e.key==='Escape')closeLB();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});LB.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});LB.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>50)show(current+(d<0?1:-1))},{passive:true});
async function load(){const {data,error}=await sb.from('event_photos').select('*').eq('status','PUBLICADA').order('created_at',{ascending:false});if(error){G.innerHTML='<div class="empty">No se pudo cargar Expo Live.</div>';return}rows=data||[];draw()}load();sb.channel('expo-live-feed').on('postgres_changes',{event:'*',schema:'public',table:'event_photos'},()=>load()).subscribe();
</script></body></html>
