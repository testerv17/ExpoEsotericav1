<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cobertura · Expo Live</title><link rel="stylesheet" href="../shared.css"><style>
.wrap{max-width:610px}.hero{margin:42px 0 24px}.hero h1{font:650 clamp(40px,9vw,64px)/.92 Syne;margin:8px 0 14px;letter-spacing:-.06em}.hero h1 span{color:#aaa4ff}.hero p{font-size:12px;line-height:1.7}.card{padding:18px}.drop{min-height:315px;border:1px dashed #aaa1ff3a;border-radius:21px;display:grid;place-items:center;overflow:hidden;background:#ffffff03;position:relative}.drop img{width:100%;height:315px;object-fit:contain;background:#070818}.empty{text-align:center;padding:28px}.spark{font:600 42px Syne;color:#aaa4ff}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}.pick{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 15px;border:1px solid #aaa1ff2d;border-radius:13px;background:#756bff16;font-size:10px;font-weight:800;cursor:pointer}.pick.primary{background:linear-gradient(110deg,#776bff,#648fff);border:0}.pick input{display:none}.fileinfo{font-size:9px;color:#8d91aa;margin-top:12px}.change{position:absolute;right:12px;top:12px;border:1px solid #ffffff24;background:#080a18d9;color:#fff;border-radius:99px;padding:9px 12px;font-size:9px;font-weight:800}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.field{padding:13px 14px;border:1px solid #aaa1ff18;border-radius:15px;background:#090b1d}.field label{display:block;font-size:8px;letter-spacing:.16em;color:#7c809d;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:16px}.field option{background:#101225}.publish{width:100%;height:56px;margin-top:11px;border:0;border-radius:16px;background:linear-gradient(110deg,#776bff,#648fff);color:#fff;font-weight:800;letter-spacing:.08em;cursor:pointer}.publish:disabled{opacity:.35}.status{text-align:center;min-height:20px;margin-top:12px;color:#969ab4;font-size:10px}.rules{display:flex;justify-content:space-between;gap:8px;margin:12px 3px 0;color:#696e89;font-size:8px}@media(max-width:500px){.shell{padding:20px 14px}.fields{grid-template-columns:1fr}.actions{flex-direction:column}.pick{width:100%}.rules{flex-direction:column;text-align:center}}
</style></head><body><main class="shell wrap"><header class="top"><div class="brand">EXPO ESOTÉRICA</div><div class="eyebrow"><span class="dot"></span>MEDIA CREW</div></header><section class="hero"><div class="eyebrow">QREVENTO · COBERTURA</div><h1>Captura el <span>momento.</span></h1><p class="muted">Toma una foto, elige de galería o sube desde computadora una imagen ya editada.</p></section><form class="glass card" id="form"><div class="drop"><div class="empty" id="empty"><div class="spark">✦</div><b>Selecciona la imagen</b><div class="actions"><label class="pick primary" id="cameraLabel">📷 TOMAR FOTO<input id="camera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><label class="pick">▣ GALERÍA / ARCHIVO<input id="gallery" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"></label></div><div class="fileinfo">JPG · PNG · WEBP · máximo 15 MB</div></div><img id="preview" hidden><button class="change" id="change" type="button" hidden>CAMBIAR</button></div><div class="rules"><span id="device">Detectando…</span><span id="info">Sin imagen</span></div><div class="fields"><div class="field"><label>AUTOR / EQUIPO</label><input id="author" required placeholder="Cobertura 01"></div><div class="field"><label>CATEGORÍA</label><select id="category"><option>Público</option><option>Stands</option><option>Conferencias</option><option>Experiencias</option><option>Escenario</option><option>General</option></select></div></div><button class="publish" id="publish" disabled>PUBLICAR EN EXPO LIVE ✦</button><div class="status" id="status">Selecciona una fotografía.</div></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const $=s=>document.querySelector(s),sb=supabase.createClient(EXPO_CONFIG.SUPABASE_URL,EXPO_CONFIG.SUPABASE_ANON_KEY);let file=null;
const cam=$('#camera'),gal=$('#gallery'),img=$('#preview'),empty=$('#empty'),pub=$('#publish'),status=$('#status'),change=$('#change'),info=$('#info');
const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);$('#device').textContent=mobile?'MÓVIL · cámara + galería':'ESCRITORIO · archivo editado';if(!mobile)$('#cameraLabel').style.display='none';
function pick(f){if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){status.textContent='Formato no permitido.';return}if(f.size>15*1024*1024){status.textContent='La imagen supera 15 MB.';return}file=f;const u=URL.createObjectURL(f);img.onload=()=>{info.textContent=`${img.naturalWidth} × ${img.naturalHeight}px · ${(f.size/1048576).toFixed(1)} MB`;URL.revokeObjectURL(u)};img.src=u;img.hidden=false;empty.hidden=true;change.hidden=false;pub.disabled=false;status.textContent='Lista para publicar.'}
cam.onchange=()=>pick(cam.files[0]);gal.onchange=()=>pick(gal.files[0]);change.onclick=()=>location.reload();
$('#form').onsubmit=async e=>{e.preventDefault();if(!file)return;pub.disabled=true;pub.textContent='PUBLICANDO…';status.textContent='Subiendo fotografía a Expo Live…';
try{const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const name=`2026/${new Date().toISOString().slice(0,10)}/${crypto.randomUUID()}.${ext}`;let {error}=await sb.storage.from(EXPO_CONFIG.BUCKET).upload(name,file,{contentType:file.type,upsert:false});if(error)throw error;
const {data:u}=sb.storage.from(EXPO_CONFIG.BUCKET).getPublicUrl(name);
let {error:dbErr}=await sb.from('event_photos').insert({author:$('#author').value.trim(),category:$('#category').value,storage_path:name,public_url:u.publicUrl,status:'PUBLICADA',featured:false});if(dbErr){await sb.storage.from(EXPO_CONFIG.BUCKET).remove([name]);throw dbErr}
status.textContent='✓ Publicada. Ya está disponible en Expo Live.';pub.textContent='PUBLICADA ✓';
}catch(err){console.error(err);status.textContent='Error: '+(err.message||'No fue posible publicar.');pub.disabled=false;pub.textContent='REINTENTAR PUBLICACIÓN ✦'}}
</script></body></html>
